# Phase 8 — AI/MCP security + live SQL MCP stdio E2E
# Uses a dedicated SQL Server service container and sibling SheikhGo-MCP checkout when present.
name: Backend Phase 8 CI

on:
  push:
    branches: [main, master]
    paths:
      - Backend/**
      - docs/AI-MCP-Phase8-ProductionReadiness.md
      - scripts/ci/phase8-live-sql-e2e.sh
      - .github/workflows/backend_phase8_ci.yml
      - azure-pipelines.yml
  pull_request:
    paths:
      - Backend/**
      - docs/AI-MCP-Phase8-ProductionReadiness.md
      - scripts/ci/phase8-live-sql-e2e.sh
      - .github/workflows/backend_phase8_ci.yml

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Dedicated CI SA password — never a production secret; not logged by tests.
  MSSQL_SA_PASSWORD: "Phase8_Ci_Sql_P@ssw0rd"
  SHEIKHGO_PHASE8_SQL_PASSWORD: "Phase8_Ci_Sql_P@ssw0rd"
  SHEIKHGO_PHASE8_SQL_HOST: "127.0.0.1,1433"
  SHEIKHGO_PHASE8_LIVE_SQL: require

jobs:
  phase8:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Phase8_Ci_Sql_P@ssw0rd"
        ports:
          - 127.0.0.1:1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Phase8_Ci_Sql_P@ssw0rd -C -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - name: Checkout Sheikh-Travel-System
        uses: actions/checkout@v4

      - name: Checkout SheikhGo-MCP (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/SheikhGo-MCP
          path: SheikhGo-MCP
          # Soft-fail path: if private/missing, local workspace sibling may be unavailable on GHA.
        continue-on-error: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build SheikhGo-MCP
        if: hashFiles('SheikhGo-MCP/package.json') != ''
        working-directory: SheikhGo-MCP
        run: |
          npm ci --ignore-scripts
          npm run build
          test -f dist/index.js

      - name: Wait for SQL
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker run --rm --network host mcr.microsoft.com/mssql/server:2022-latest \
              /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" &>/dev/null; then
              echo "SQL ready"
              exit 0
            fi
            # Fallback: TCP only
            if nc -z 127.0.0.1 1433; then
              echo "SQL port open (attempt $i)"
              sleep 3
              exit 0
            fi
            sleep 2
          done
          echo "SQL did not become ready"
          exit 1

      - name: Phase 8 unit + live SQL MCP E2E
        env:
          SHEIKHGO_PHASE8_MCP_ENTRY: ${{ github.workspace }}/SheikhGo-MCP/dist/index.js
          SHEIKHGO_MCP_ROOT: ${{ github.workspace }}/SheikhGo-MCP
          SHEIKHGO_PHASE8_SQL_CONNECTION: Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Phase8_Ci_Sql_P@ssw0rd;TrustServerCertificate=True;Encrypt=False;
          SHEIKHGO_DB_CONNECTION: Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Phase8_Ci_Sql_P@ssw0rd;TrustServerCertificate=True;Encrypt=False;
        run: |
          set -euo pipefail
          if [[ ! -f "$SHEIKHGO_PHASE8_MCP_ENTRY" ]]; then
            echo "SheikhGo-MCP not checked out — failing live E2E (required in CI)."
            echo "Ensure repository_owner/SheikhGo-MCP is accessible or vendor MCP dist."
            exit 1
          fi
          chmod +x scripts/ci/phase8-live-sql-e2e.sh
          # Use env already set; script re-exports require mode.
          MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
          SHEIKHGO_MCP_ROOT="$SHEIKHGO_MCP_ROOT" \
          ./scripts/ci/phase8-live-sql-e2e.sh
