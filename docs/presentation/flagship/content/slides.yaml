slides:
  - id: 1
    layout: cover
    title: SheikhGo AI Fleet Operations Platform
    subtitle: The Next Generation Intelligent Fleet Ecosystem
    bullets:
      - Enterprise · Government · Investors · Logistics · Fleet Operators
    notes: Open with brand, not features.

  - id: 2
    layout: two_column
    title: Company Vision
    badge: Available
    left_title: Where we are
    left:
      - Multi-tenant fleet and travel operations ERP
      - Live GPS, maintenance, notifications, compliance
      - Web command center plus mobile field apps
      - Production-ready for regional operators
    right_title: Where we are going
    right:
      - AI-augmented decisioning across the fleet
      - Predictive maintenance and fleet health
      - Copilot for dispatch, managers, and executives
      - Regional expansion with Vision 2030 ambition
    notes: Keep Available vs Vision crisp for tender credibility.

  - id: 3
    layout: bullets
    title: Executive Summary
    badge: Available
    bullets:
      - SheikhGo is a multi-tenant Fleet and Travel Operations Platform — not a single-purpose GPS tool
      - One system for office (Angular ERP) and road (Flutter apps) on a shared ASP.NET Core API
      - Core pillars live today — fleet, GPS (Traccar), maintenance, bookings, notifications, security and audit
      - AI layer is the next-generation differentiator — Settings and Copilot hooks exist; full engines are Vision
      - Built for enterprise tenants, government-grade control, and regional scale
    kpis:
      - { label: Control surfaces, value: Web + Mobile }
      - { label: Tenancy, value: Shared-schema }
      - { label: Realtime, value: SignalR }
      - { label: AI maturity, value: Vision path }

  - id: 4
    layout: two_column
    title: Mission & Vision
    left_title: Mission
    left:
      - Give fleet and travel operators a single intelligent system for vehicles, drivers, trips, and customers
      - Replace WhatsApp, spreadsheets, and fragmented GPS with structured, auditable operations
      - Deliver realtime visibility from the office to the road
    right_title: Vision
    right:
      - Become the leading AI Fleet Operations Platform for South Asia, the GCC, and emerging markets
      - Turn every notification, trip, and maintenance event into actionable intelligence
      - Power safer fleets, lower cost-per-km, and executive-grade decision support

  - id: 5
    layout: bullets
    title: Why SheikhGo
    badge: Available
    bullets:
      - Unified platform — fleet, travel, GPS, maintenance, and notifications in one tenant
      - Role-first design — Super Admin, Tenant Admin, Fleet, Dispatcher, Driver Manager, Driver
      - Enterprise foundations — JWT permissions, audit center, security settings, multi-branch scoping
      - Field-ready mobile — trips, GPS, attendance, fuel, inspections, SOS, offline sync
      - Honest AI roadmap — evolve Notification Center and dashboards into a true intelligence layer
      - Regional fit — EN/AR readiness and operator workflows for Pakistan and GCC markets

