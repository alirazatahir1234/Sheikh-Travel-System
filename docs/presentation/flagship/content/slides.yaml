      - { label: Compliance fines, value: Docs & licenses }
      - { label: Labor leakage, value: Manual process }
    bullets:
      - Fuel, maintenance, insurance, and idle time dominate cost-per-km
      - Lack of unified data makes savings hard to prove to finance
      - Predictive and KPI-driven ops (Vision) amplify savings already available from visibility today

  - id: 15
    layout: bullets
    title: Manual Operations
    bullets:
