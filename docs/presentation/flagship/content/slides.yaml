  - id: 12
    layout: comparison
    title: Current Industry Problems
    left_title: Typical today
    left:
      - WhatsApp / phone dispatch
      - Spreadsheet vehicle and driver lists
      - Standalone GPS portals
      - Paper fuel and inspection records
      - Weak change history
      - Alerts without prioritization
    right_title: With SheikhGo
    right:
      - Structured bookings and trip lifecycle
      - Vehicles and drivers in ERP
      - Live map and geofences in the same system
      - Digital evidence with photos and audit
      - Security and Audit Center
      - Notification Center with retention and channels

  - id: 13
    layout: bullets
    title: Notification Overload
    badge: Available
    bullets:
      - GPS systems generate high volumes of speed, geofence, ignition, and device alerts
      - Without priority and context, managers ignore or mute channels
      - Critical safety events get buried under routine noise
      - SheikhGo ships a Notification Center with preferences, templates, and lifecycle
      - Vision — AI Smart Notification Engine that scores, suppresses, and escalates intelligently

  - id: 14
    layout: kpi_cards
    title: Rising Fleet Costs
    kpis:
