name: sheikh_go_driver
description: SheikhGo Tracking App — Owner live tracking, drivers, fuel, and driver operations
publish_to: 'none'
version: 1.0.5+30

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.0

  # Secure storage & local cache
  flutter_secure_storage: ^10.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Biometrics
  local_auth: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Location & GPS
  geolocator: ^11.0.0
  permission_handler: ^11.3.1

  # Background tasks
  workmanager: ^0.9.0

  # Real-time (SignalR)
  signalr_netcore: ^1.3.4

  # Firebase
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5

  # Maps
  google_maps_flutter: ^2.18.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.0

  # UI helpers
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  flutter_native_splash: ^2.4.0
  intl: ^0.20.2
  crypto: ^3.0.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  google_fonts: ^8.2.1
  speech_to_text: ^7.0.0
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Omit integration_test for Play release builds: Flutter still registers it in
  # GeneratedPluginRegistrant while excluding it from the release classpath,
  # which fails compileReleaseJavaWithJavac. Re-add when running integration_test/*.
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  # Plugins (maps/secure_storage/workmanager) are CocoaPods-only on current Flutter.
  # Keep SPM off so iOS builds do not fail resolving FlutterGeneratedPluginSwiftPackage.
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/branding/sheikhgo_nexus_logo.png
    - assets/branding/sheikhgo_logo_official.png
    - assets/icons/playback/
  # Bundled brand typeface so Android (and offline iOS) match audited typography
  # without relying on Google Fonts runtime download → system Roboto fallback.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

# Native layer: solid brand navy only (no bitmap — avoids black-matte logo artifacts).
# Full Nexus logo + loader animation live in Flutter `SplashScreen`.
flutter_native_splash:
  color: "#0A1628"
  color_dark: "#0A1628"
  android_12:
    color: "#0A1628"
  ios: true
  android: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  # Brand navy (matches splash). Full Nexus logo on padded adaptive foreground
  # so circular/squircle masks keep globe/satellite/car — not only "SG".
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: assets/icon/app_icon_adaptive_fg.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/app_icon.png
