<div class="wa-webhook-logs stb-page">
  <ui-page-header
    title="WhatsApp webhook logs"
    subtitle="Inbound Meta payloads — requeue failed processing"
    [breadcrumbs]="breadcrumbs">
    <div class="header-actions">
      <button mat-stroked-button type="button" (click)="load()" [disabled]="loading">
        <mat-icon>refresh</mat-icon>
        Refresh
      </button>
    </div>
  </ui-page-header>

  <div class="wa-filters">
    <button
      type="button"
      class="wa-filter"
      *ngFor="let s of statuses"
      [class.active]="statusFilter === s"
      (click)="setStatus(s)">
      {{ s || 'All' }}
    </button>
  </div>

  <div class="table-wrap" *ngIf="!loading; else loadingTpl">
    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Received</th>
          <th>Sig</th>
          <th>Status</th>
          <th>Attempts</th>
          <th>Error</th>
          <th>Preview</th>
          <th *ngIf="canManage">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of logs">
          <td>{{ r.id }}</td>
          <td>{{ r.receivedAtUtc | date: 'short' }}</td>
          <td>
            <span class="sig" [class.ok]="r.signatureValid" [class.bad]="!r.signatureValid">
              {{ r.signatureValid ? 'OK' : 'Bad' }}
            </span>
          </td>
          <td>{{ r.processingStatus }}</td>
          <td>{{ r.attempts }}</td>
          <td class="err">{{ r.error || '—' }}</td>
          <td class="preview">{{ r.payloadPreview || '—' }}</td>
          <td *ngIf="canManage">
            <button
              mat-stroked-button
              type="button"
              (click)="requeue(r)"
              [disabled]="!r.signatureValid || requeueingId === r.id">
              Requeue
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <p class="empty" *ngIf="!logs.length">No webhook logs.</p>
    <p class="meta" *ngIf="logs.length">Showing {{ logs.length }} of {{ total }}</p>
  </div>
  <ng-template #loadingTpl>
    <div class="loading"><mat-spinner diameter="28"></mat-spinner></div>
  </ng-template>
</div>
