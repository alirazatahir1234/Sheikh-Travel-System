<div class="demo-modal-root" role="presentation" (click)="onBackdropClick($event)">
  <div
    class="demo-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="videoTitle"
    (click)="$event.stopPropagation()"
  >
    <header class="demo-modal-head">
      <div>
        <p class="demo-modal-kicker">Product walkthrough</p>
        <h2>{{ videoTitle }}</h2>
        <p class="demo-modal-lead">
          ~2½ min inside the logged-in Nexus ERP — sidebar, GPS, bookings, finance, WhatsApp, and AI.
        </p>
      </div>
      <button type="button" class="demo-modal-close" (click)="close()" aria-label="Close demo video">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </header>
    <div class="demo-modal-video-wrap" (contextmenu)="$event.preventDefault()">
      <video
        #player
        class="demo-modal-video"
        controls
        controlsList="nodownload noplaybackrate"
        disablePictureInPicture
        playsinline
        preload="metadata"
        [src]="videoSrc"
        (canplay)="onCanPlay()"
        (dragstart)="$event.preventDefault()"
      >
        Your browser does not support embedded video.
      </video>
    </div>
    <footer class="demo-modal-foot">
      @if (canDownloadDemo) {
        <button
          type="button"
          class="demo-modal-download demo-modal-download--button"
          [disabled]="downloadInProgress"
          (click)="downloadDemoForOwner()"
        >
          {{ downloadInProgress ? 'Preparing download…' : 'Download ERP tour (MP4)' }}
        </button>
      }
      <a [href]="websiteTourSrc" class="demo-modal-download demo-modal-download--secondary">
        Marketing site tour
      </a>
    </footer>
  </div>
</div>
