<div class="demo-modal-root" role="presentation" (click)="onBackdropClick($event)">
  <div
    class="demo-modal"
    [class.demo-modal--portrait]="mode() === 'mobile'"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="activeTitle()"
    (click)="$event.stopPropagation()"
  >
    <header class="demo-modal-head">
      <div>
        <p class="demo-modal-kicker">
          {{ kickerKey() | wsTranslate }}
        </p>
        <h2>{{ activeTitle() }}</h2>
        <p class="demo-modal-lead">
          {{ leadKey() | wsTranslate }}
        </p>
        <div class="demo-modal-tabs" role="tablist" [attr.aria-label]="'common.demoVideos' | wsTranslate">
          <button
            type="button"
            role="tab"
            class="demo-modal-tab"
            [class.is-active]="mode() === 'erp'"
            [attr.aria-selected]="mode() === 'erp'"
            (click)="setMode('erp')"
          >
            {{ 'common.watchDemo' | wsTranslate }}
          </button>
          <button
            type="button"
            role="tab"
            class="demo-modal-tab"
            [class.is-active]="mode() === 'promo'"
            [attr.aria-selected]="mode() === 'promo'"
            (click)="setMode('promo')"
          >
            {{ 'common.watchPromo' | wsTranslate }}
          </button>
          <button
            type="button"
            role="tab"
            class="demo-modal-tab"
            [class.is-active]="mode() === 'mobile'"
            [attr.aria-selected]="mode() === 'mobile'"
            (click)="setMode('mobile')"
          >
            {{ 'common.watchMobile' | wsTranslate }}
          </button>
        </div>
      </div>
      <button type="button" class="demo-modal-close" (click)="close()" aria-label="Close demo video">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </header>
    <div
      class="demo-modal-video-wrap"
      [class.demo-modal-video-wrap--portrait]="mode() === 'mobile'"
      (contextmenu)="$event.preventDefault()"
    >
      <video
        #player
        class="demo-modal-video"
        controls
        controlsList="nodownload noplaybackrate"
        disablePictureInPicture
        playsinline
        preload="metadata"
        [src]="activeSrc()"
        (canplay)="onCanPlay()"
        (dragstart)="$event.preventDefault()"
        [attr.crossorigin]="mode() === 'erp' ? null : 'anonymous'"
      >
        @if (activeCaptionsSrc(); as captionsSrc) {
          <track
            kind="captions"
            [src]="captionsSrc"
            srclang="en"
            label="English"
            default
          />
        }
        Your browser does not support embedded video.
      </video>
    </div>
    <footer class="demo-modal-foot">
      @if (canDownloadDemo) {
        <button
          type="button"
          class="demo-modal-download demo-modal-download--button"
          [disabled]="downloadInProgress"
          (click)="downloadDemoForOwner()"
        >
          {{ downloadInProgress ? 'Preparing download…' : 'Download ERP tour (MP4)' }}
        </button>
      }
      @if (mode() === 'promo' || mode() === 'mobile') {
        <a routerLink="/request-demo" class="demo-modal-download" (click)="close()">
          {{ 'common.requestDemoArrow' | wsTranslate }}
        </a>
      } @else {
        <a [href]="websiteTourSrc" class="demo-modal-download demo-modal-download--secondary">
          Marketing site tour
        </a>
      }
    </footer>
  </div>
</div>
