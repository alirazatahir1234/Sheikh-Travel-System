<section class="auth-page">
  <app-login-hero [year]="year"></app-login-hero>

  <div class="auth-form-side">
    <article class="auth-card">
      <header class="ac-head">
        <h2>Forgot your password?</h2>
        <p>Enter your email and we’ll send a password reset link.</p>
      </header>

      <form *ngIf="!sent" [formGroup]="form" (ngSubmit)="submit()" class="ac-form">
        <div class="stb-field auth-field">
          <label for="forgot-email">Email address</label>
          <input id="forgot-email" class="stb-input auth-input" type="email"
                 formControlName="email" autocomplete="username"
                 placeholder="you@company.com" />
        </div>
        <button mat-flat-button type="submit" class="full-width ac-submit" [disabled]="loading || form.invalid">
          <mat-spinner *ngIf="loading" diameter="20" class="ac-spinner"></mat-spinner>
          <span *ngIf="!loading">Send reset link</span>
        </button>
        <p class="ac-help">
          <button type="button" class="ac-link" (click)="backToLogin()">Back to sign in</button>
        </p>
      </form>

      <div *ngIf="sent" class="ac-form">
        <p class="sent-msg">Check your email for further instructions. The link expires in 2 hours.</p>
        <button mat-flat-button type="button" class="full-width ac-submit" (click)="backToLogin()">
          Back to sign in
        </button>
      </div>
    </article>
  </div>
</section>
