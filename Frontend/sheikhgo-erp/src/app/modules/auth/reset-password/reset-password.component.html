<section class="auth-page">
  <app-login-hero [year]="year"></app-login-hero>

  <div class="auth-form-side">
    <article class="auth-card">
      <header class="ac-head">
        <h2>Set a new password</h2>
        <p>Choose a strong password for your SheikhGo account.</p>
      </header>

      <form [formGroup]="form" (ngSubmit)="submit()" class="ac-form">
        <div class="stb-field auth-field">
          <label for="new-password">New password</label>
          <div class="stb-input-wrap stb-input-wrap--suffix">
            <input id="new-password" class="stb-input auth-input" formControlName="password"
                   [type]="hidePassword ? 'password' : 'text'"
                   autocomplete="new-password" placeholder="Minimum 6 characters" />
            <button type="button" class="stb-input-suffix-btn auth-suffix-btn"
                    (click)="hidePassword = !hidePassword"
                    [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>
        <div class="stb-field auth-field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" class="stb-input auth-input" type="password"
                 formControlName="confirm" autocomplete="new-password" />
        </div>
        <ul class="reqs">
          <li>Minimum length (at least 6 characters)</li>
          <li>Your organization may require upper, lower, number and symbol</li>
        </ul>
        <button mat-flat-button type="submit" class="full-width ac-submit" [disabled]="loading || form.invalid || !token">
          <mat-spinner *ngIf="loading" diameter="20" class="ac-spinner"></mat-spinner>
          <span *ngIf="!loading">Update password</span>
        </button>
        <p class="ac-help">
          <button type="button" class="ac-link" (click)="backToLogin()">Back to sign in</button>
        </p>
      </form>
    </article>
  </div>
</section>
