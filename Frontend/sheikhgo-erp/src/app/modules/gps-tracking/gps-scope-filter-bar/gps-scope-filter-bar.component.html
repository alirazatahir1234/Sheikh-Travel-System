<section class="gps-scope-bar" aria-label="Company and vehicle scope">
  <div class="gps-scope-bar__entities">
    <div class="filter-entity filter-entity--company" *ngIf="scope.isSuperAdmin">
      <span class="filter-entity__icon-wrap" aria-hidden="true">
        <mat-icon class="filter-entity__icon">business</mat-icon>
      </span>
      <mat-form-field appearance="outline" class="filter-entity__field">
        <mat-label>Company</mat-label>
        <mat-select
          [value]="scope.companyFilterId"
          [disabled]="companiesLoading"
          (selectionChange)="onCompanyChange($event.value)">
          <mat-option [value]="null">Select a company</mat-option>
          <mat-option *ngFor="let c of companies" [value]="c.id">{{ c.name }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="filter-entity filter-entity--vehicle">
      <span class="filter-entity__icon-wrap" aria-hidden="true">
        <mat-icon class="filter-entity__icon">local_shipping</mat-icon>
      </span>
      <mat-form-field appearance="outline" class="filter-entity__field">
        <mat-label>Vehicle</mat-label>
        <mat-select
          [value]="scope.vehicleFilterId"
          [disabled]="scope.vehicleFilterDisabled || vehiclesLoading"
          (selectionChange)="onVehicleChange($event.value)">
          <mat-option [value]="null">All vehicles</mat-option>
          <mat-option *ngFor="let v of vehicles" [value]="v.id">
            {{ v.name }} ({{ v.registrationNumber || '—' }})
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <p class="gps-scope-bar__hint" *ngIf="scope.isSuperAdmin && !scope.isFleetScopeReady">
    Select a company to view vehicles on Live Map, History, Alerts, and Driver Performance. Devices still loads your home tenant until a company is picked.
  </p>

  <div class="gps-scope-bar__applied" *ngIf="scope.hasActiveScope">
    <button type="button" class="clear-scope" (click)="clearScope()" aria-label="Clear company and vehicle scope">
      <mat-icon aria-hidden="true">close</mat-icon>
      Clear Scope
    </button>
  </div>
</section>
