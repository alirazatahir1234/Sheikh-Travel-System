<section class="gps-scope-bar" aria-label="Vehicle scope">
  <div class="gps-scope-bar__entities">
    <div
      class="filter-entity filter-entity--vehicle"
      [matTooltip]="scope.vehicleFilterDisabled ? 'Pick a company in the header to choose a vehicle' : ''"
      [matTooltipDisabled]="!scope.vehicleFilterDisabled">
      <span class="filter-entity__icon-wrap" aria-hidden="true">
        <mat-icon class="filter-entity__icon">local_shipping</mat-icon>
      </span>
      <mat-form-field appearance="outline" class="filter-entity__field">
        <mat-label>Vehicle</mat-label>
        <mat-select
          [value]="scope.vehicleFilterId"
          [disabled]="scope.vehicleFilterDisabled || vehiclesLoading"
          (selectionChange)="onVehicleChange($event.value)">
          <mat-option [value]="null">All vehicles</mat-option>
          <mat-option *ngFor="let v of vehicles" [value]="v.id">
            {{ v.name }} ({{ v.registrationNumber || '—' }})
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <p class="gps-scope-bar__hint" *ngIf="scope.usesGlobalSwitcher && !scope.isFleetScopeReady">
    Pick a company from the header switcher to view Live Map, History, Alerts, and Driver Performance.
  </p>

  <div class="gps-scope-bar__applied" *ngIf="scope.hasActiveScope">
    <button type="button" class="clear-scope" (click)="clearScope()" aria-label="Clear vehicle filter">
      <mat-icon aria-hidden="true">close</mat-icon>
      Clear vehicle
    </button>
  </div>
</section>
