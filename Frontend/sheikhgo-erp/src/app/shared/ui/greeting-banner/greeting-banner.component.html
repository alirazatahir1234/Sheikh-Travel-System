<div class="stb-greeting" [class.is-compact]="compact">
  <h1 class="g-title">
    Good {{ timeOfDay }},
    <span class="g-name">{{ userName }}!</span>
  </h1>
  <p class="g-sub" *ngIf="notificationsCount > 0; else noNotif">
    <mat-icon>notifications_active</mat-icon>
    You have
    <a class="g-link" [routerLink]="notificationsLink">{{ notificationsCount }} unread {{ subject }}</a>.
  </p>
  <ng-template #noNotif>
    <p class="g-sub">
      <mat-icon>check_circle</mat-icon>
      You're all caught up — no unread {{ subject }}.
    </p>
  </ng-template>
</div>
