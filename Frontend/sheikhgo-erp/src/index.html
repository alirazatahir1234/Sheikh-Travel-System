<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SheikhGo Nexus | Fleet Intelligence, GPS &amp; AI</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SheikhGo NEXUS — live GPS tracking, geofencing, playback, offline sync, fleet health alerts, Nexus operations, and honest AI assistants for transport teams.">
  <meta property="og:title" content="SheikhGo Nexus | Fleet Intelligence, GPS &amp; AI">
  <meta property="og:description" content="SheikhGo NEXUS — live GPS tracking, geofencing, playback, offline sync, fleet health alerts, Nexus operations, and honest AI assistants for transport teams.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SheikhGo Technologies">
  <meta property="og:url" content="https://www.sheikhgo.com/">
  <meta property="og:image" content="https://www.sheikhgo.com/brand/sheikhgo-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0E3D3A">
  <link rel="icon" type="image/png" href="brand/sheikhgo-app-icon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="brand/sheikhgo-app-icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="brand/sheikhgo-app-icon-512.png">

  <!-- Fonts load at runtime via <link> (not SCSS @import) so CI builds do not fetch Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter (app primary typeface) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- DM Sans + Syne (public website / marketing surfaces) -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Plus Jakarta Sans + Manrope (Fleet management UI typefaces) -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Material Icons (required by every <mat-icon>) -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <style>
    #app-initial-splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f8fffe 0%, #eef8f6 100%);
    }

    #app-initial-splash svg {
      width: 112px;
      height: 112px;
      filter: drop-shadow(0 4px 14px rgba(14, 61, 58, 0.18));
    }

    #app-initial-splash .boot-nexus {
      transform-origin: 60px 60px;
      animation: boot-nexus-spin 2.8s linear infinite;
    }

    #app-initial-splash .boot-nexus-link {
      stroke-dasharray: 10 18;
      animation: boot-nexus-flow 1.4s linear infinite;
    }

    #app-initial-splash .boot-nexus-node {
      transform-box: fill-box;
      transform-origin: center;
      animation: boot-nexus-node 1.6s ease-in-out infinite;
    }

    #app-initial-splash .boot-nexus-node:nth-child(1) { animation-delay: 0s; }
    #app-initial-splash .boot-nexus-node:nth-child(2) { animation-delay: 0.12s; }
    #app-initial-splash .boot-nexus-node:nth-child(3) { animation-delay: 0.24s; }
    #app-initial-splash .boot-nexus-node:nth-child(4) { animation-delay: 0.36s; }
    #app-initial-splash .boot-nexus-node:nth-child(5) { animation-delay: 0.48s; }
    #app-initial-splash .boot-nexus-node:nth-child(6) { animation-delay: 0.6s; }

    #app-initial-splash .boot-hub {
      transform-origin: 60px 60px;
      animation: boot-hub-pulse 1.85s ease-in-out infinite;
    }

    #app-initial-splash .boot-logo-wrap {
      transform-origin: 60px 55px;
      animation: boot-logo-pulse 1.85s ease-in-out infinite;
    }

    @keyframes boot-nexus-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes boot-nexus-flow {
      to { stroke-dashoffset: -28; }
    }

    @keyframes boot-nexus-node {
      0%, 100% { opacity: 0.55; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes boot-hub-pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    @keyframes boot-logo-pulse {
      0%, 100% { opacity: 0.88; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-initial-splash .boot-nexus,
      #app-initial-splash .boot-nexus-link,
      #app-initial-splash .boot-nexus-node,
      #app-initial-splash .boot-hub,
      #app-initial-splash .boot-logo-wrap {
        animation: none !important;
      }

      #app-initial-splash .boot-nexus-node,
      #app-initial-splash .boot-logo-wrap {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="app-initial-splash" aria-hidden="true">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="bootNexusGlow" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0FAF9F" stop-opacity="0.4" />
          <stop offset="55%" stop-color="#0FAF9F" />
          <stop offset="100%" stop-color="#5eead4" />
        </linearGradient>
        <radialGradient id="bootHubGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#0FAF9F" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- Soft hub aura -->
      <circle cx="60" cy="60" r="28" fill="url(#bootHubGlow)" />

      <!-- Nexus mesh: hub + hex ring of nodes -->
      <g class="boot-nexus">
        <!-- Outer hexagon frame -->
        <polygon
          points="60,12 101.57,36 101.57,84 60,108 18.43,84 18.43,36"
          fill="none"
          stroke="#0FAF9F"
          stroke-width="1.5"
          stroke-opacity="0.22"
        />

        <!-- Spoke links hub → nodes -->
        <g stroke="url(#bootNexusGlow)" stroke-width="2" stroke-linecap="round" fill="none">
          <line class="boot-nexus-link" x1="60" y1="60" x2="60" y2="12" />
          <line class="boot-nexus-link" x1="60" y1="60" x2="101.57" y2="36" />
          <line class="boot-nexus-link" x1="60" y1="60" x2="101.57" y2="84" />
          <line class="boot-nexus-link" x1="60" y1="60" x2="60" y2="108" />
          <line class="boot-nexus-link" x1="60" y1="60" x2="18.43" y2="84" />
          <line class="boot-nexus-link" x1="60" y1="60" x2="18.43" y2="36" />
        </g>

        <!-- Inter-node ring links -->
        <g stroke="#0FAF9F" stroke-width="1.75" stroke-opacity="0.55" stroke-linecap="round" fill="none">
          <line class="boot-nexus-link" x1="60" y1="12" x2="101.57" y2="36" />
          <line class="boot-nexus-link" x1="101.57" y1="36" x2="101.57" y2="84" />
          <line class="boot-nexus-link" x1="101.57" y1="84" x2="60" y2="108" />
          <line class="boot-nexus-link" x1="60" y1="108" x2="18.43" y2="84" />
          <line class="boot-nexus-link" x1="18.43" y1="84" x2="18.43" y2="36" />
          <line class="boot-nexus-link" x1="18.43" y1="36" x2="60" y2="12" />
        </g>

        <!-- Outer nodes -->
        <g fill="#0FAF9F">
          <circle class="boot-nexus-node" cx="60" cy="12" r="4.5" />
          <circle class="boot-nexus-node" cx="101.57" cy="36" r="4.5" />
          <circle class="boot-nexus-node" cx="101.57" cy="84" r="4.5" />
          <circle class="boot-nexus-node" cx="60" cy="108" r="4.5" />
          <circle class="boot-nexus-node" cx="18.43" cy="84" r="4.5" />
          <circle class="boot-nexus-node" cx="18.43" cy="36" r="4.5" />
        </g>

        <!-- Hub core -->
        <g class="boot-hub">
          <circle cx="60" cy="60" r="11" fill="none" stroke="url(#bootNexusGlow)" stroke-width="2.5" />
          <circle cx="60" cy="60" r="4" fill="#0E3D3A" />
        </g>
      </g>

      <g class="boot-logo-wrap">
        <image href="brand/sheikhgo-logo.png" x="36" y="33" width="48" height="46" preserveAspectRatio="xMidYMid meet" />
      </g>
    </svg>
  </div>
  <app-root></app-root>
</body>
</html>
