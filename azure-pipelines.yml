# SheikhGo — Azure DevOps CI/CD
#
# PRODUCTION PIPELINE: SheikhGo-Deploy-GitHub only (GitHub repo Sheikh-Travel-System).
# Do NOT use SheikhGo-Deploy / Azure Repos "SheikhGo" — that mirror can lag main by
# hundreds of commits and overwrite Vercel/API with a stale build (incident 2026-11-12,
# run 141 @ ff92a22a after GitHub run 140 @ 757fe534).
#
# Trigger: push to main (or master). batch: true collapses rapid pushes.
#
# Jobs (path-filtered inside each job; override with FORCE_FULL_DEPLOY=true):
#   1) Backend → Azure VM 20.174.1.230 (systemd sheikhgo-api :5082)
#      via self-hosted pool SheikhGo-VM (agent runs ON the VM)
#   2) Frontend → Vercel project sheikh-travel-system (ERP + optional Customer Hub)
#
# Does NOT touch Railway.
#
# Setup: docs/deploy/azure-vm-vercel-cicd.md
# Required variables (pipeline or Library group "SheikhGo-Deploy"):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_ERP_PROJECT_ID
#   VERCEL_HUB_PROJECT_ID (optional — PLACEHOLDER/empty skips hub; ERP still deploys)
#   VERCEL_PROD (optional, default true)
#   GOOGLE_MAPS_API_KEY (SheikhGo-Frontend browser key — required for ERP live map)
#   GOOGLE_MAPS_MAP_ID (optional Advanced Markers map ID)
#   GEOAPIFY_API_KEY (optional secret — geofence editor place search; unset turns the search off)
# Optional (manual runs): FORCE_FULL_DEPLOY=true to deploy VM+Vercel even if path filter
# would skip; use after a bad overwrite / recovery.

trigger:
  batch: true
  branches:
    include:
      - main
      - master
  paths:
    include:
      - Backend/**
      - Frontend/sheikhgo-erp/**
      - Frontend/sheikh-travel-customer-hub/**
      - deploy/azure-vm/**
      - deploy/vercel/**
      - scripts/ci/**
      - docs/AI-MCP-Phase8-ProductionReadiness.md
      - azure-pipelines.yml
      - .github/workflows/backend_phase8_ci.yml

pr: none

# Manual "Run pipeline" checkbox — forces VM + Vercel even when path filters would skip.
parameters:
  - name: FORCE_FULL_DEPLOY
    displayName: Force full deploy (VM + Vercel), ignore path filters
    type: boolean
    default: false

# Library group (Vercel + Maps). Required for Frontend job env macros.
variables:
  - group: SheikhGo-Deploy
  - name: FORCE_FULL_DEPLOY
    value: ${{ parameters.FORCE_FULL_DEPLOY }}

stages:
  # ── Phase 8 AI/MCP tests (incl. live SQL + MCP stdio when SQL/MCP available) ──
  - stage: Phase8_CI
    displayName: Phase 8 AI/MCP tests
    condition: always()
    jobs:
      - job: Phase8_Tests
        displayName: Phase 8 + live SQL MCP E2E
        pool:
          name: SheikhGo-VM
        steps:
          - checkout: self
            clean: false
            fetchDepth: 1

          - bash: |
              set -euo pipefail
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                if git diff --name-only HEAD^ HEAD | grep -qE '^Backend/|^scripts/ci/|^docs/AI-MCP-Phase8|^azure-pipelines\.yml|^\.github/workflows/backend_phase8'; then
                  echo "##vso[task.setvariable variable=SKIP_PHASE8]false"
                  echo "Backend/Phase8 paths changed — running Phase 8 tests."
                else
                  echo "##vso[task.setvariable variable=SKIP_PHASE8]true"
                  echo "No Backend/Phase8 path changes — skipping Phase 8 tests."
                fi
              else
                echo "##vso[task.setvariable variable=SKIP_PHASE8]false"
              fi
            displayName: Detect Phase 8 test scope

          - bash: |
              set -euo pipefail
              # Unresolved ADO macros look like $(NAME) — treat as unset (never log values).
              for v in SHEIKHGO_PHASE8_SQL_PASSWORD MSSQL_SA_PASSWORD SHEIKHGO_MCP_ROOT; do
                val="${!v:-}"
                if [[ -z "$val" || "$val" =~ ^\$\( ]]; then
                  unset "$v" || true
                fi
              done
              # Prefer Library secret SHEIKHGO_PHASE8_SQL_PASSWORD; fall back to docker-compose.db.env on VM (never echo).
              if [[ -z "${SHEIKHGO_PHASE8_SQL_PASSWORD:-}" && -f "$(Build.SourcesDirectory)/docker-compose.db.env" ]]; then
                MSSQL_SA_PASSWORD="$(grep -E '^MSSQL_SA_PASSWORD=' "$(Build.SourcesDirectory)/docker-compose.db.env" | cut -d= -f2- | tr -d '\r')"
                export MSSQL_SA_PASSWORD
                export SHEIKHGO_PHASE8_SQL_PASSWORD="$MSSQL_SA_PASSWORD"
              fi
              if [[ -z "${SHEIKHGO_PHASE8_SQL_PASSWORD:-}" ]]; then
                echo "##vso[task.logissue type=warning]No SQL password for Phase 8 — unit Phase8 still runs; live E2E soft-skips."
              fi
              export SHEIKHGO_MCP_ROOT="${SHEIKHGO_MCP_ROOT:-/home/azureuser/SheikhGo-MCP}"
              if [[ ! -f "${SHEIKHGO_MCP_ROOT}/dist/index.js" ]]; then
                CANDIDATE="$(dirname "$(Build.SourcesDirectory)")/SheikhGo-MCP"
                if [[ -f "${CANDIDATE}/dist/index.js" ]]; then
                  export SHEIKHGO_MCP_ROOT="$CANDIDATE"
                fi
              fi
              chmod +x "$(Build.SourcesDirectory)/scripts/ci/phase8-live-sql-e2e.sh"
              "$(Build.SourcesDirectory)/scripts/ci/phase8-live-sql-e2e.sh"
            condition: ne(variables['SKIP_PHASE8'], 'true')
            displayName: Run Phase 8 live SQL MCP E2E
            env:
              SHEIKHGO_PHASE8_SQL_PASSWORD: $(SHEIKHGO_PHASE8_SQL_PASSWORD)
              MSSQL_SA_PASSWORD: $(MSSQL_SA_PASSWORD)
              SHEIKHGO_MCP_ROOT: $(SHEIKHGO_MCP_ROOT)

          - bash: |
              set -euo pipefail
              # Unresolved ADO macros look like $(NAME) — treat as unset (never log values).
              for v in SHEIKHGO_PHASE8_SQL_PASSWORD MSSQL_SA_PASSWORD; do
                val="${!v:-}"
                if [[ -z "$val" || "$val" =~ ^\$\( ]]; then
                  unset "$v" || true
                fi
              done
              if [[ -z "${SHEIKHGO_PHASE8_SQL_PASSWORD:-}" && -f "$(Build.SourcesDirectory)/docker-compose.db.env" ]]; then
                MSSQL_SA_PASSWORD="$(grep -E '^MSSQL_SA_PASSWORD=' "$(Build.SourcesDirectory)/docker-compose.db.env" | cut -d= -f2- | tr -d '\r')"
                export MSSQL_SA_PASSWORD
                export SHEIKHGO_PHASE8_SQL_PASSWORD="$MSSQL_SA_PASSWORD"
              fi
              chmod +x "$(Build.SourcesDirectory)/scripts/ci/travelnexus-live-sql-e2e.sh"
              "$(Build.SourcesDirectory)/scripts/ci/travelnexus-live-sql-e2e.sh"
            condition: ne(variables['SKIP_PHASE8'], 'true')
            displayName: Run TravelNexus live SQL E2E
            env:
              SHEIKHGO_PHASE8_SQL_PASSWORD: $(SHEIKHGO_PHASE8_SQL_PASSWORD)
              MSSQL_SA_PASSWORD: $(MSSQL_SA_PASSWORD)

  - stage: Deploy
    displayName: Deploy Backend (Azure VM) and Frontend (Vercel)
    dependsOn: Phase8_CI
    # Deploy proceeds when Phase8 skipped (path filter) or succeeded; blocks on Phase8 failure.
    condition: in(dependencies.Phase8_CI.result, 'Succeeded', 'SucceededWithIssues')
    jobs:
      # Single job: one SheikhGo-VM agent. Two parallel jobs were left "pending"
      # forever after Phase8 (no second agent / parallelism grant).
      - job: Deploy_VM_And_Vercel
        displayName: Backend VM + Frontend Vercel
        pool:
          name: SheikhGo-VM
        variables:
          DEPLOY_BRANCH: $[coalesce(variables['Build.SourceBranchName'], 'main')]
        steps:
          - checkout: self
            clean: false
            # Need enough history to compare SourceVersion age vs origin/main tip.
            fetchDepth: 50

          - bash: |
              set -euo pipefail
              echo "Repository provider: $(Build.Repository.Provider)"
              echo "Repository name: $(Build.Repository.Name)"
              echo "SourceVersion: $(Build.SourceVersion)"
              # Hard block: Azure Repos "SheikhGo" mirror is stale vs GitHub and must not deploy prod.
              PROVIDER="$(Build.Repository.Provider)"
              REPO_NAME="$(Build.Repository.Name)"
              if [[ "$PROVIDER" == "TfsGit" ]] || [[ "$REPO_NAME" == "SheikhGo" && "$PROVIDER" != "GitHub" ]]; then
                echo "##vso[task.logissue type=error]Refusing deploy from Azure Repos mirror ($REPO_NAME / $PROVIDER). Use pipeline SheikhGo-Deploy-GitHub (GitHub Sheikh-Travel-System) only."
                exit 1
              fi
              # Refuse to promote a commit that is behind the tip of origin/main (out-of-order / stale SHA).
              cd "$(Build.SourcesDirectory)"
              git fetch --depth=50 origin main 2>/dev/null || git fetch --depth=50 origin refs/heads/main:refs/remotes/origin/main || true
              TIP="$(git rev-parse origin/main 2>/dev/null || true)"
              HEAD="$(Build.SourceVersion)"
              if [[ -n "$TIP" && "$TIP" != "$HEAD" ]]; then
                if git merge-base --is-ancestor "$HEAD" "$TIP" 2>/dev/null; then
                  # HEAD is strictly behind tip — only allow if this is not a production promote of an old SHA.
                  # IndividualCI on an older commit that finished late must not overwrite newer prod.
                  BEHIND="$(git rev-list --count "${HEAD}..${TIP}" 2>/dev/null || echo '?')"
                  echo "##vso[task.logissue type=error]Build SourceVersion $HEAD is ${BEHIND} commit(s) behind origin/main tip $TIP. Refusing production deploy to avoid overwriting a newer release. Re-queue on current main tip (or set FORCE_FULL_DEPLOY after resetting to tip)."
                  exit 1
                fi
              fi
              echo "Deploy gate OK (provider=$PROVIDER tip=${TIP:-unknown} head=$HEAD)."
            displayName: Gate — GitHub only + refuse stale SHA

          - bash: |
              set -euo pipefail
              FORCE="$(FORCE_FULL_DEPLOY)"
              FORCE="$(echo "${FORCE:-false}" | tr '[:upper:]' '[:lower:]')"
              if [[ "$FORCE" == "true" || "$FORCE" == "1" || "$FORCE" == "yes" ]]; then
                echo "##vso[task.setvariable variable=SKIP_VM]false"
                echo "FORCE_FULL_DEPLOY — will deploy Azure VM."
                exit 0
              fi
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                if git diff --name-only HEAD^ HEAD | grep -qE '^Backend/|^deploy/azure-vm/|^azure-pipelines\.yml'; then
                  echo "##vso[task.setvariable variable=SKIP_VM]false"
                  echo "Backend paths changed — will deploy to Azure VM."
                else
                  echo "##vso[task.setvariable variable=SKIP_VM]true"
                  echo "No Backend path changes — skipping Azure VM deploy."
                fi
              else
                echo "##vso[task.setvariable variable=SKIP_VM]false"
                echo "No parent commit; running Azure VM deploy."
              fi
            displayName: Detect Backend changes
            env:
              FORCE_FULL_DEPLOY: $(FORCE_FULL_DEPLOY)

          - bash: |
              set -euo pipefail
              chmod +x "$(Build.SourcesDirectory)/deploy/azure-vm/deploy-api.sh"
              export BUILD_SOURCESDIRECTORY="$(Build.SourcesDirectory)"
              export DEPLOY_BRANCH="$(DEPLOY_BRANCH)"
              "$(Build.SourcesDirectory)/deploy/azure-vm/deploy-api.sh"
            condition: ne(variables['SKIP_VM'], 'true')
            displayName: Publish and restart sheikhgo-api on VM
            env:
              DEPLOY_BRANCH: $(DEPLOY_BRANCH)

          - bash: |
              set -euo pipefail
              FORCE="$(FORCE_FULL_DEPLOY)"
              FORCE="$(echo "${FORCE:-false}" | tr '[:upper:]' '[:lower:]')"
              if [[ "$FORCE" == "true" || "$FORCE" == "1" || "$FORCE" == "yes" ]]; then
                echo "##vso[task.setvariable variable=SKIP_VERCEL]false"
                echo "FORCE_FULL_DEPLOY — will deploy Vercel."
                exit 0
              fi
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                if git diff --name-only HEAD^ HEAD | grep -qE '^Frontend/sheikhgo-erp/|^Frontend/sheikh-travel-customer-hub/|^deploy/vercel/|^azure-pipelines\.yml'; then
                  echo "##vso[task.setvariable variable=SKIP_VERCEL]false"
                  echo "Frontend paths changed — will deploy to Vercel."
                else
                  echo "##vso[task.setvariable variable=SKIP_VERCEL]true"
                  echo "No Frontend path changes — skipping Vercel deploy."
                fi
              else
                echo "##vso[task.setvariable variable=SKIP_VERCEL]false"
                echo "No parent commit; running Vercel deploy."
              fi
            displayName: Detect Frontend changes
            env:
              FORCE_FULL_DEPLOY: $(FORCE_FULL_DEPLOY)

          - bash: |
              set -euo pipefail
              echo "=== SheikhGo-VM memory hygiene (pre-Node) ==="
              free -h
              swapon --show || true
              pkill -f 'vercel deploy' 2>/dev/null || true
              pkill -f 'ng build' 2>/dev/null || true
              pkill -f 'VBCSCompiler' 2>/dev/null || true
              pkill -f 'MSBuild.dll' 2>/dev/null || true
              sleep 1
              sync || true
              if [[ -w /proc/sys/vm/drop_caches ]]; then
                echo 3 > /proc/sys/vm/drop_caches || true
              else
                sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true
              fi
              free -h
              AVAIL_MB=$(free -m | awk '/^Mem:/{print $7}')
              echo "MemAvailable=${AVAIL_MB}Mi"
              if [[ "${AVAIL_MB}" -lt 800 ]]; then
                echo "##vso[task.logissue type=warning]Low MemAvailable (${AVAIL_MB}Mi) before Angular build — risk of exit 137 OOM."
              fi
            condition: ne(variables['SKIP_VERCEL'], 'true')
            displayName: Free memory check (pre-build)

          - task: NodeTool@0
            condition: ne(variables['SKIP_VERCEL'], 'true')
            displayName: Install Node.js
            inputs:
              versionSpec: '20.x'

          - bash: |
              set -euo pipefail
              chmod +x "$(Build.SourcesDirectory)/deploy/vercel/deploy-frontends.sh"
              "$(Build.SourcesDirectory)/deploy/vercel/deploy-frontends.sh"
            condition: ne(variables['SKIP_VERCEL'], 'true')
            displayName: Deploy sheikhgo-erp + customer-hub to Vercel
            env:
              NODE_OPTIONS: --max-old-space-size=3072
              NG_BUILD_MAX_WORKERS: '1'
              VERCEL_TOKEN: $(VERCEL_TOKEN)
              VERCEL_ORG_ID: $(VERCEL_ORG_ID)
              VERCEL_ERP_PROJECT_ID: $(VERCEL_ERP_PROJECT_ID)
              VERCEL_HUB_PROJECT_ID: $(VERCEL_HUB_PROJECT_ID)
              VERCEL_PROD: $(VERCEL_PROD)
              GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
              GOOGLE_MAPS_MAP_ID: $(GOOGLE_MAPS_MAP_ID)
              GEOAPIFY_API_KEY: $(GEOAPIFY_API_KEY)
