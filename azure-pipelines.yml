# SheikhGo — Azure DevOps CI/CD
#
# Org: Alirazatahir · Project: SheikhGo · Repo: SheikhGo
# Trigger: push to main (or master)
#
# Jobs (path-filtered inside each job):
#   1) Backend → Azure VM 20.174.1.230 (systemd sheikhgo-api :5082)
#      via self-hosted pool SheikhGo-VM (agent runs ON the VM)
#   2) Frontend → Vercel (ERP + Customer Hub via vercel CLI)
#
# Does NOT touch Railway.
#
# Setup: docs/deploy/azure-vm-vercel-cicd.md
# Required variables (pipeline or Library group "SheikhGo-Deploy"):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_ERP_PROJECT_ID
#   VERCEL_HUB_PROJECT_ID (optional — PLACEHOLDER/empty skips hub; ERP still deploys)
#   VERCEL_PROD (optional, default true)

trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - Backend/**
      - Frontend/sheikhgo-erp/**
      - Frontend/sheikh-travel-customer-hub/**
      - deploy/azure-vm/**
      - deploy/vercel/**
      - azure-pipelines.yml

pr: none

stages:
  - stage: Deploy
    displayName: Deploy Backend (Azure VM) and Frontend (Vercel)
    jobs:
      # ── Backend → Azure VM (self-hosted on 20.174.1.230) ───────────
      - job: Backend_AzureVM
        displayName: Backend → Azure VM (sheikhgo-api)
        pool:
          name: SheikhGo-VM
        variables:
          DEPLOY_BRANCH: $[coalesce(variables['Build.SourceBranchName'], 'main')]
        steps:
          - checkout: self
            clean: false
            fetchDepth: 1

          - bash: |
              set -euo pipefail
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                if git diff --name-only HEAD^ HEAD | grep -qE '^Backend/|^deploy/azure-vm/|^azure-pipelines\.yml'; then
                  echo "##vso[task.setvariable variable=SKIP_VM]false"
                  echo "Backend paths changed — will deploy to Azure VM."
                else
                  echo "##vso[task.setvariable variable=SKIP_VM]true"
                  echo "No Backend path changes — skipping Azure VM deploy."
                fi
              else
                echo "##vso[task.setvariable variable=SKIP_VM]false"
                echo "No parent commit; running Azure VM job."
              fi
            displayName: Detect Backend changes

          - bash: |
              set -euo pipefail
              chmod +x "$(Build.SourcesDirectory)/deploy/azure-vm/deploy-api.sh"
              export BUILD_SOURCESDIRECTORY="$(Build.SourcesDirectory)"
              export DEPLOY_BRANCH="$(DEPLOY_BRANCH)"
              "$(Build.SourcesDirectory)/deploy/azure-vm/deploy-api.sh"
            condition: ne(variables['SKIP_VM'], 'true')
            displayName: Publish and restart sheikhgo-api on VM
            env:
              DEPLOY_BRANCH: $(DEPLOY_BRANCH)

      # ── Frontend → Vercel (self-hosted: avoids Microsoft-hosted parallelism) ──
      - job: Frontend_Vercel
        displayName: Frontend → Vercel
        pool:
          name: SheikhGo-VM
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                if git diff --name-only HEAD^ HEAD | grep -qE '^Frontend/sheikhgo-erp/|^Frontend/sheikh-travel-customer-hub/|^deploy/vercel/|^azure-pipelines\.yml'; then
                  echo "##vso[task.setvariable variable=SKIP_VERCEL]false"
                  echo "Frontend paths changed — will deploy to Vercel."
                else
                  echo "##vso[task.setvariable variable=SKIP_VERCEL]true"
                  echo "No Frontend path changes — skipping Vercel deploy."
                fi
              else
                echo "##vso[task.setvariable variable=SKIP_VERCEL]false"
                echo "No parent commit; running Vercel job."
              fi
            displayName: Detect Frontend changes

          - task: NodeTool@0
            condition: ne(variables['SKIP_VERCEL'], 'true')
            displayName: Install Node.js
            inputs:
              versionSpec: '20.x'

          - bash: |
              set -euo pipefail
              chmod +x "$(Build.SourcesDirectory)/deploy/vercel/deploy-frontends.sh"
              "$(Build.SourcesDirectory)/deploy/vercel/deploy-frontends.sh"
            condition: ne(variables['SKIP_VERCEL'], 'true')
            displayName: Deploy sheikhgo-erp + customer-hub to Vercel
            env:
              VERCEL_TOKEN: $(VERCEL_TOKEN)
              VERCEL_ORG_ID: $(VERCEL_ORG_ID)
              VERCEL_ERP_PROJECT_ID: $(VERCEL_ERP_PROJECT_ID)
              VERCEL_HUB_PROJECT_ID: $(VERCEL_HUB_PROJECT_ID)
              VERCEL_PROD: $(VERCEL_PROD)
